services:
  - type: web
    name: hospital-project
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run migrate && node server/scripts/bootstrap-admin.js && npm start
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSPITAL_NAME
        value: City General Hospital
      - key: HOSPITAL_TZ
        value: Asia/Karachi
      - key: CURRENCY
        value: PKR
      - key: APP_BASE_URL
        fromService:
          name: hospital-project
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_API_BASE_URL
        fromService:
          name: hospital-project
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-project-db
          property: connectionString
      - key: DB_POOL_MAX
        value: 10
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: BLIND_INDEX_KEY
        generateValue: true
      - key: SESSION_IDLE_MINUTES
        value: 10
      - key: SESSION_ABSOLUTE_HOURS
        value: 12
      - key: LOGIN_MAX_ATTEMPTS
        value: 3
      - key: LOGIN_LOCK_MINUTES
        value: 15
      - key: LOGIN_RATE_LIMIT
        value: 100
      - key: RESET_TOKEN_HOURS
        value: 24
      - key: COOKIE_SECURE
        value: true
      - key: TRUST_PROXY
        value: true
      - key: UPLOAD_DIR
        value: ./storage/uploads
      - key: BACKUP_DIR
        value: ./storage/backups
      - key: BACKUP_RETENTION_DAYS
        value: 30
      - key: MAX_UPLOAD_MB
        value: 10
      - key: ENABLE_SCHEDULER
        value: true
      - key: BACKUP_CRON
        value: 0 0 * * *
      - key: HEALTH_CRON
        value: 0 * * * *
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_UPLOADS
        sync: false
      - key: R2_BUCKET_BACKUPS
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_REGION
        value: auto
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: hospital-project-db
    databaseName: hospital_project
    plan: free
